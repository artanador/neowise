<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Входящие заявки</title>
    <style>
      body {
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
        font:
          1rem/1.5 system-ui,
          sans-serif;
      }
      textarea {
        box-sizing: border-box;
        display: block;
        width: 100%;
        margin: 0.5rem 0;
        padding: 0.5rem;
        font: inherit;
      }
      button {
        padding: 0.4rem 0.8rem;
        font: inherit;
      }
      pre {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Входящие заявки</h1>
    <form>
      <label for="message">Текст заявки</label>
      <textarea id="message" rows="4"></textarea>
      <button type="submit">Разобрать заявку</button>
    </form>
    <pre id="result" aria-live="polite"></pre>
    <script type="module">
      const form = document.querySelector("form");
      const result = document.querySelector("#result");
      const message = document.querySelector("#message");

      const topics = {
        delivery: "Доставка",
        pricing: "Стоимость",
        other: "Другое",
      };

      let latestRequestId = 0;

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const requestId = ++latestRequestId;
        const text = message.value.trim();

        result.textContent = "";

        if (!text) {
          result.textContent = "Введите текст заявки.";
          return;
        }

        result.textContent = "Обработка заявки...";

        try {
          const reply = await fetch("/api/triage", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text }),
          });

          const data = await reply.json();

          if (requestId !== latestRequestId) {
            return;
          }

          if (reply.status === 400 && data.status === "invalid_input") {
            result.textContent = "Введите корректный текст заявки.";
            return;
          }

          if (!reply.ok) {
            throw new Error("API error");
          }

          if (data.status === "ready") {
            result.textContent =
              `Тема: ${topics[data.topic]}\n\n` +
              `Черновик ответа:\n${data.draft}`;
          } else {
            result.textContent =
              "Не удалось обработать заявку автоматически, необходим ручной разбор.";
          }
        } catch {
          if (requestId !== latestRequestId) {
            return;
          }

          result.textContent =
            "Не удалось обработать заявку, необходим ручной разбор.";
        }
      });
    </script>
  </body>
</html>
